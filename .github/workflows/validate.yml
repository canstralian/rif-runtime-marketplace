name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Marketplace, plugin, and skill structure
        run: python3 scripts/validate.py
      - name: PromptIR / PromptBuild conformance
        run: python3 scripts/validate_prompt_ir.py --strict examples/
      - name: Conformance checker self-test
        run: python3 scripts/test_validator.py
